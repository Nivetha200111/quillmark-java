# SYNTHETIC demo repository for the Diocle hackathon project.
name: reverify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The only legacy repository a certificate may name, and the only Diocle branch a verifier commit may come from.
  LEGACY_REPO: https://github.com/Nivetha200111/quillmark-mainframe
  DIOCLE_REPO: https://github.com/Nivetha200111/Diocle
  DIOCLE_BRANCH: main

jobs:
  reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache GnuCOBOL 3.2
        id: gnucobol
        uses: actions/cache@v4
        with:
          path: ~/gnucobol
          key: gnucobol-3.2-ubuntu-24.04-v1

      - name: Build GnuCOBOL 3.2 (same version Diocle certifies with)
        if: steps.gnucobol.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libgmp-dev
          curl -sSfL https://ftp.gnu.org/gnu/gnucobol/gnucobol-3.2.tar.xz | tar xJ
          cd gnucobol-3.2
          ./configure -q --prefix="$HOME/gnucobol" --without-db --with-curses=no --without-xml2 --without-json
          make -s -j"$(nproc)" && make -s install

      - name: Put GnuCOBOL on the path
        run: |
          echo "$HOME/gnucobol/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/gnucobol/lib" >> "$GITHUB_ENV"

      - name: Install the Diocle verifier pinned by the certificates
        run: |
          shopt -s nullglob
          certs=(programs/*/certificate.json)
          if [ ${#certs[@]} -eq 0 ]; then echo "No certificates to verify."; echo "NONE=1" >> "$GITHUB_ENV"; exit 0; fi
          commit=$(python -c "import json,sys; c={json.load(open(p))['verification']['verifier']['commit'] for p in sys.argv[1:]}; assert len(c)==1, c; print(c.pop())" "${certs[@]}")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "verifier commit is not a full SHA: $commit"; exit 1; }
          git clone -q --filter=blob:none --branch "$DIOCLE_BRANCH" -- "$DIOCLE_REPO" diocle
          git -C diocle merge-base --is-ancestor "$commit" "origin/$DIOCLE_BRANCH" \
            || { echo "verifier commit $commit is not on $DIOCLE_REPO $DIOCLE_BRANCH"; exit 1; }
          git -C diocle checkout -q "$commit"
          pip install -q -e diocle/services/analyzer -e diocle/services/verifier
          cobc --version | head -1

      - name: Re-verify every program on fresh inputs
        if: env.NONE != '1'
        run: |
          seed=$(( ${{ github.run_id }} % 1000000 + 10000 ))
          python -m diocle_verifier.reverify programs --seed "$seed" --random 1000 \
            --expect-legacy "$LEGACY_REPO" --summary "$GITHUB_STEP_SUMMARY"
